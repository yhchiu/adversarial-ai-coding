[project]
name = "adversarial-ai-coding"
version = "0.1.0"
description = "Adversarial two-AI coding workflow"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[project.scripts]
adversarial-ai-coding = "adversarial_ai_coding.cli:main_entry"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Nearly every second of this suite is process spawning (git and the fake
# agent wrappers), so it scales almost linearly across workers.
addopts = "-m 'not e2e' -n auto"
markers = [
    "e2e: real-agent end-to-end; consumes quota; run manually with -m e2e",
]
