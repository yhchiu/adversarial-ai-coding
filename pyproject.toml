[project]
name = "adversarial-ai-coding"
version = "0.1.0"
description = "Adversarial two-AI coding workflow"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[project.scripts]
adversarial-ai-coding = "adversarial_ai_coding.cli:main_entry"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
