name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/fixture/go.mod
          cache: false

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check shell syntax
        run: bash -n adversarial-ai-coding.sh tests/helpers.test.sh tests/resume.test.sh tests/e2e/run.sh

      - name: Run helper tests
        run: bash tests/helpers.test.sh

      - name: Run resume suite
        run: bash tests/resume.test.sh

      - name: Run setup-only E2E fixture
        env:
          E2E_SETUP_ONLY: "1"
          GOCACHE: /tmp/go-build-aac
        run: |
          mkdir -p "$GOCACHE"
          bash tests/e2e/run.sh

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      # Keep LF endings: the runner's default autocrlf would break shell scripts.
      - name: Force LF checkout
        run: git config --global core.autocrlf input

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: bash -n adversarial-ai-coding.sh tests/helpers.test.sh tests/resume.test.sh tests/e2e/run.sh

      - name: Run helper tests
        run: bash tests/helpers.test.sh

      - name: Run resume suite
        run: bash tests/resume.test.sh

  test-python:
    name: Tests (Python, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q
