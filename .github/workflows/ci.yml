name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-python:
    name: Tests (Python, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go (fixture baseline test)
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/e2e/fixture/go.mod
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        # The default selection is the fast inner loop; -m overrides it so CI
        # also runs the slow offline integration tests. Only the real-agent
        # e2e tests, which consume quota, stay out.
        run: uv run pytest -q -m "not e2e"
